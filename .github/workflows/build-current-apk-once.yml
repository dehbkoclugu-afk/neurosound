name: Build Current Android APK Once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/build-current-apk-once.yml

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Build release APK
        run: |
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a,x86_64/' android/gradle.properties
          cd android
          ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: neurosound-current-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
