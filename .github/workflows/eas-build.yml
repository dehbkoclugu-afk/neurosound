# Elle tetiklenen EAS build/submit. Bu sandbox'ın kendisi api.expo.dev'e
# çıkamıyor (organizasyon egress politikası engelliyor) — GitHub Actions
# runner'ları bu kısıtlamaya tabi değil, o yüzden gerçek EAS işlemleri
# buradan yürütülüyor.
#
# Gereken repo secret'ı: EXPO_TOKEN (expo.dev → Account settings →
# Access Tokens → Create token). iOS build'in ilk kez interaktif olmayan
# şekilde çalışabilmesi için, bir kere kendi bilgisayarınızdan
# `eas build --platform ios` çalıştırıp imzalama sertifikalarını EAS
# sunucularında (remote) saklamayı seçmeniz gerekiyor — sonrasında bu
# workflow onları otomatik kullanır.
name: EAS Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform'
        required: true
        default: 'android'
        type: choice
        options: [android, ios, all]
      profile:
        description: 'eas.json build profile'
        required: true
        default: 'preview'
        type: choice
        options: [development, preview, production]
      submit:
        description: 'Build sonrası mağazaya gönder (eas submit)'
        required: true
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    # `eas build --wait` sits in EAS's queue before its own build even starts,
    # and on the free tier that wait alone can pass an hour. At 60 the runner
    # killed the step while the build was still queued — the build carried on
    # at EAS, but the job reported "cancelled" and nothing said why.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Yayın girdilerini doğrula
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN" || { echo "EXPO_TOKEN eksik"; exit 1; }
          if [[ "${{ inputs.submit }}" == "true" ]]; then
            [[ "${{ inputs.profile }}" == "production" ]] || { echo "Submit yalnız production profile ile yapılabilir"; exit 1; }
            if [[ "${{ inputs.platform }}" == "android" || "${{ inputs.platform }}" == "all" ]]; then
              test -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" || { echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON eksik"; exit 1; }
              printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > play-service-account.json
              jq -e . play-service-account.json >/dev/null
              chmod 600 play-service-account.json
            fi
          fi

      - name: EAS build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli build \
            --platform ${{ inputs.platform }} \
            --profile ${{ inputs.profile }} \
            --non-interactive \
            --wait

      # A cancelled or timed-out job leaves no trace of what EAS actually did,
      # and the build usually finished there regardless. This prints the last
      # few builds with their status and artifact URLs, so the outcome is
      # recoverable from the log either way.
      - name: EAS build durumu
        if: always()
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli build:list --platform ${{ inputs.platform }} --limit 3 --non-interactive || true

      - name: Android mağazaya gönder
        if: ${{ inputs.submit && (inputs.platform == 'android' || inputs.platform == 'all') }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli submit \
            --platform android \
            --profile production \
            --latest \
            --non-interactive

      - name: iOS mağazaya gönder
        if: ${{ inputs.submit && (inputs.platform == 'ios' || inputs.platform == 'all') }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli submit \
            --platform ios \
            --profile production \
            --latest \
            --non-interactive

      - name: Geçici mağaza anahtarını sil
        if: always()
        run: rm -f play-service-account.json
