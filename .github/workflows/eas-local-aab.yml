# Production AAB built on the GitHub runner with `eas build --local`, so it
# does not use the EAS Free plan's monthly cloud build quota. Signs with the
# same remote keystore as cloud builds, then submits to Play's internal track
# (eas.json submit profile); move it on with the "Play release" workflow.
name: EAS local AAB

on:
  workflow_dispatch:

concurrency:
  group: play-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      - run: npm ci

      - name: Build AAB locally
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_NO_EXPO_GO_WARNING: 'true'
        run: npx eas-cli build --platform android --profile production --local --non-interactive --output 852hz.aab

      - uses: actions/upload-artifact@v4
        with:
          name: 852hz-aab
          path: 852hz.aab

      - name: Submit to Play internal track
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > play-service-account.json
          chmod 600 play-service-account.json
          npx eas-cli submit --platform android --profile production --path 852hz.aab --non-interactive

      - name: Remove temporary Play credential
        if: always()
        run: rm -f play-service-account.json
