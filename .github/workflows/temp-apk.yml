name: Temporary Android APK

on:
  push:
    branches: [agent/visual-shell-player-overhaul]
    paths:
      - .github/workflows/temp-apk.yml

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Limit architectures
        run: sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a,x86_64/' android/gradle.properties
      - name: Build APK
        run: cd android && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: neurosound-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
