# Elle tetiklenen APK derlemesi: expo prebuild + gradle, EAS'a hiç dokunmaz.
# Çıktı: Actions run sayfasından indirilebilir "neurosound-apk" artifact'i.
# İmza: Expo şablonunun varsayılanı (debug keystore) — test/sideload için;
# mağaza yayını EAS production build ile yapılır.
name: Android APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Runner diski RN release paketlemesine dar geliyor — kullanılmayan
      # önyüklü araçları silerek yer aç
      - name: Disk temizliği
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules
          df -h /

      - name: Bağımlılıklar
        run: npm ci

      - name: Android projesini üret (prebuild)
        run: npx expo prebuild --platform android --no-install

      # Yalnız gerçek cihaz (arm64) + emülatör (x86_64) mimarileri:
      # derleme süresi ve disk yarıya iner, APK küçülür
      - name: Mimarileri daralt
        run: |
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a,x86_64/' android/gradle.properties
          grep reactNativeArchitectures android/gradle.properties

      - name: APK derle
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Disk durumu
        if: always()
        run: df -h /

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: neurosound-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  # Duman testi: APK emülatörde açılıyor mu? Çökerse stack log'a düşer.
  smoke:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: APK'yı indir
        uses: actions/download-artifact@v4
        with:
          name: neurosound-apk

      - name: KVM izinleri
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emülatörde aç ve logcat topla
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -eu
            adb install app-release.apk
            adb logcat -c
            adb shell am start -W -n com.dehbkoclugu.neurosound/.MainActivity
            sleep 30
            adb logcat -d > logcat.txt
            adb shell pidof com.dehbkoclugu.neurosound
            ! grep -Eq "FATAL EXCEPTION|Fatal signal|tombstoned" logcat.txt

      - name: Logcat'i yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat
          path: logcat.txt
          if-no-files-found: ignore
