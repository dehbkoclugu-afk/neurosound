# Elle tetiklenen APK derlemesi: expo prebuild + gradle, EAS'a hiç dokunmaz.
# Çıktı: Actions run sayfasından indirilebilir "852hz-unsigned-aab" artifact'i.
# İmza: Expo şablonunun varsayılanı (debug keystore) — test/sideload için;
# mağaza yayını EAS production build ile yapılır.
name: Android unsigned AAB

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Runner diski RN release paketlemesine dar geliyor — kullanılmayan
      # önyüklü araçları silerek yer aç
      - name: Disk temizliği
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules
          df -h /

      - name: Bağımlılıklar
        run: npm ci

      - name: Android projesini üret (prebuild)
        run: npx expo prebuild --platform android --no-install

      # Yalnız gerçek cihaz (arm64) + emülatör (x86_64) mimarileri:
      # derleme süresi ve disk yarıya iner, APK küçülür
      - name: Mimarileri daralt
        run: |
          sed -i -E 's/^([[:space:]]*versionCode[[:space:]]+)[0-9]+/\18/; /signingConfig signingConfigs.debug/d' android/app/build.gradle
          grep reactNativeArchitectures android/gradle.properties

      - name: APK derle
        run: cd android && ./gradlew bundleRelease --no-daemon

      - name: Disk durumu
        if: always()
        run: df -h /

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: 852hz-unsigned-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

