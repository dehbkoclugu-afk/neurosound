<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>852Hz — Canlı açık görseller</title>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Schibsted+Grotesk:wght@400;500;600&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 2000px; height: 1180px; background: #F5F1EB; font-family: 'Schibsted Grotesk', sans-serif; color: #1D1922; overflow: hidden; }
  .board { padding: 50px 60px; }
  h1 { font: 400 40px 'Young Serif'; }
  .sub { font-size: 18px; color: #4F4852; margin-top: 6px; }
  .grid { display: grid; grid-template-columns: 160px repeat(4, 1fr); gap: 18px; margin-top: 34px; align-items: center; }
  .lbl { font: 600 17px 'Schibsted Grotesk'; color: #4F4852; }
  .lbl small { display: block; font-weight: 400; font-size: 14px; margin-top: 4px; }
  .colh { font: 400 24px 'Young Serif'; text-align: left; }
  .cell { height: 400px; border-radius: 26px; overflow: hidden; position: relative; }
  .cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cell .name { position: absolute; left: 18px; bottom: 16px; font: 400 30px 'Young Serif'; z-index: 2; }
  .old .name { color: #1D1922; }
  /* vivid daylight treatment of the dark originals: lift exposure, keep the
     colour the scene actually has, warm the highlights, and lay a soft paper
     fade only at the bottom where text sits. */
  .new img { filter: brightness(1.55) contrast(1.08) saturate(1.45); }
  .new::before { content: ''; position: absolute; inset: 0; z-index: 1; background: linear-gradient(160deg, rgba(255,214,160,.35), rgba(255,255,255,0) 55%); mix-blend-mode: soft-light; }
  .new::after { content: ''; position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, rgba(245,241,235,0) 55%, rgba(245,241,235,.92)); }
  .old::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(245,241,235,0) 55%, rgba(245,241,235,.92)); }
</style>
</head>
<body><div class="board">
  <h1>Açık tema görselleri</h1>
  <div class="sub">Üst sıra: uygulamadaki mevcut açık görseller. Alt sıra: koyu görsellerden ışık ve renk işlenerek üretilen canlı gündüz versiyonu.</div>
  <div class="grid">
    <div></div><div class="colh">Ateş</div><div class="colh">Okyanus</div><div class="colh">Orman</div><div class="colh">528 Hz</div>

    <div class="lbl">Şimdiki<small>soluk, gri</small></div>
    <div class="cell old"><img src="../../assets/images/art/light/presets/noise-fire.jpg"><span class="name">Ateş</span></div>
    <div class="cell old"><img src="../../assets/images/art/light/presets/noise-ocean.jpg"><span class="name">Okyanus</span></div>
    <div class="cell old"><img src="../../assets/images/art/light/presets/noise-forest.jpg"><span class="name">Orman</span></div>
    <div class="cell old"><img src="../../assets/images/art/light/presets/solfeggio-528.jpg"><span class="name">528 Hz</span></div>

    <div class="lbl">Canlı<small>sıcak, renkli</small></div>
    <div class="cell new"><img src="../../assets/images/art/presets/noise-fire.jpg"><span class="name">Ateş</span></div>
    <div class="cell new"><img src="../../assets/images/art/presets/noise-ocean.jpg"><span class="name">Okyanus</span></div>
    <div class="cell new"><img src="../../assets/images/art/presets/noise-forest.jpg"><span class="name">Orman</span></div>
    <div class="cell new"><img src="../../assets/images/art/presets/solfeggio-528.jpg"><span class="name">528 Hz</span></div>
  </div>
</div></body>
</html>
