name: Submit Android Release Once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/production-android-once.yml

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify release credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          test -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > play-service-account.json
          jq -e . play-service-account.json >/dev/null
          chmod 600 play-service-account.json
      - name: Submit existing AAB to Google Play Internal Testing
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli submit --platform android --profile production --latest --non-interactive
      - name: Remove temporary Play credential
        if: always()
        run: rm -f play-service-account.json
